name: Build and Deploy Pyszczko Valley

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: game

      - name: Checkout GB Studio 4.3.2
        uses: actions/checkout@v4
        with:
          repository: chrismaltby/gb-studio
          ref: v4.3.2
          path: gb-studio
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install GB Studio dependencies
        working-directory: gb-studio
        run: |
          yarn install --frozen-lockfile
          npm run fetch-deps

      - name: Build GB Studio CLI
        working-directory: gb-studio
        run: npm run make:cli

      - name: Build Pyszczko Valley for Web
        run: |
          node gb-studio/out/cli/gb-studio-cli.js make:web \
            "game/Pyszczko Valley.gbsproj" \
            "$GITHUB_WORKSPACE/web-build"

      - name: Add desktop controls legend
        run: python3 game/scripts/add-controls.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
